#
# sudo docker run --rm --runtime=nvidia --gpus all nvidia/cuda:12.6.3-cudnn-devel-ubuntu24.04 nvidia-smi
# 
# docker compose build --progress=plain
# docker compose up -d
# docker attach hypertor
#
services:
  hypertor:
    build: .
    image: alpinebuster/hypertor:latest
    pull_policy: never
    container_name: hypertor
    restart: unless-stopped
    ports:
      - "6006-6009:6006-6009"
    volumes:
      - ./:/root/workspace
    shm_size: 64g
    gpus: all
    pid: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    stdin_open: true
    tty: true
    command: /bin/bash
